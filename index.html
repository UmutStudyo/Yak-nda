<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Yakında</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-center items-center p-4 m-0 overflow-hidden select-none">

    <!-- Main Container -->
    <div class="flex flex-col items-center justify-center text-center max-w-lg w-full space-y-8">
        
        <!-- Image Container -->
        <div class="relative group animate-float">
            <!-- Glow background effect -->
            <div class="absolute -inset-1.5 bg-gradient-to-r from-red-600 via-purple-600 to-indigo-600 rounded-3xl blur-md opacity-50 group-hover:opacity-80 transition duration-1000"></div>
            
            <!-- Husky Image -->
            <img src="https://i.imgur.com/8Q9Z4yL.jpeg" 
                 alt="Gizli gizli girme husky" 
                 class="relative rounded-2xl w-72 h-72 sm:w-84 sm:h-84 object-cover shadow-2xl border-2 border-neutral-700/80 bg-neutral-900" />
        </div>

        <!-- Text Section -->
        <div class="space-y-3">
            <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight text-white drop-shadow-[0_2px_15px_rgba(239,68,68,0.4)]">
                Gizli gizli girme <span class="inline-block hover:scale-125 transition-transform cursor-pointer text-red-500">:)</span>
            </h1>
            <p class="text-xl sm:text-2xl font-semibold text-neutral-300 tracking-wide">
                site yakında
            </p>
        </div>

        <!-- Pulse indicator -->
        <div class="flex items-center space-x-2 pt-2">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
            </span>
            <span class="text-xs uppercase tracking-widest text-neutral-500 font-bold">YAKINDA HİZMETİNİZDE</span>
        </div>

    </div>

</body>
</html>
